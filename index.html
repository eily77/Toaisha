
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">



<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at center, #fff8f5 0%, #f7dfe3 55%, #dfbdc8 100%);
    font-family: Georgia, serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}



.hint {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;

    color: rgba(112, 68, 81, .6);
    font-size: 14px;
}

/* Floating hearts */
.heart {
    position: fixed;
    color: #c9788b;
    opacity: .45;
    font-size: 25px;
    z-index: 2;
    animation: float 4s ease-in-out infinite;
}

.h1 { left: 10%; top: 25%; }
.h2 { right: 12%; top: 20%; animation-delay: 1s; }
.h3 { left: 17%; bottom: 20%; animation-delay: 2s; }
.h4 { right: 18%; bottom: 25%; animation-delay: 3s; }

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-18px) rotate(8deg);
    }
}
</style>
</head>

<body>



<div class="hint">
    move your mouse around
</div>

<div class="heart h1">♡</div>
<div class="heart h2">♡</div>
<div class="heart h3">♡</div>
<div class="heart h4">♡</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const image = new Image();

/*
    IMPORTANT:
    The image you uploaded to GitHub
    must be named applejack.jpg
*/
image.src = "applejack.jpg";


let particles = [];

let mouse = {
    x: -1000,
    y: -1000
};


/*
    DOT SIZE

    Smaller number = more dots = more detail.

    4  -> VERY detailed
    5  -> detailed
    6  -> balanced
    8  -> fewer dots
*/

const DOT_STEP = 5;


/*
    Resize canvas
*/

function resize() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    createParticles();
}


/*
    Create dot-art from image
*/

function createParticles() {

    particles = [];

    if (!image.complete || !image.naturalWidth) {
        return;
    }


    const tempCanvas =
        document.createElement("canvas");

    const tempCtx =
        tempCanvas.getContext("2d");


    /*
        Make Applejack fit nicely
        inside the screen.
    */

    const maxWidth =
        canvas.width * 0.70;

    const maxHeight =
        canvas.height * 0.72;


    const scale =
        Math.min(
            maxWidth / image.naturalWidth,
            maxHeight / image.naturalHeight
        );


    const width =
        Math.floor(image.naturalWidth * scale);

    const height =
        Math.floor(image.naturalHeight * scale);


    tempCanvas.width = width;
    tempCanvas.height = height;


    tempCtx.drawImage(
        image,
        0,
        0,
        width,
        height
    );


    const pixels =
        tempCtx.getImageData(
            0,
            0,
            width,
            height
        ).data;


    const startX =
        (canvas.width - width) / 2;


    /*
        Move the image slightly downward
        because we have the title above it.
    */

    const startY =
        (canvas.height - height) / 2 + 40;


    /*
        Read every few pixels
    */

    for (
        let y = 0;
        y < height;
        y += DOT_STEP
    ) {

        for (
            let x = 0;
            x < width;
            x += DOT_STEP
        ) {

            const pixelX =
                Math.floor(x);

            const pixelY =
                Math.floor(y);


            const index =
                (pixelY * width + pixelX) * 4;


            const r = pixels[index];
            const g = pixels[index + 1];
            const b = pixels[index + 2];
            const a = pixels[index + 3];


            /*
                Ignore transparent pixels
            */

            if (a < 100) {
                continue;
            }


            /*
                Ignore the white background
                of your uploaded image.

                This is what makes the Applejack
                appear as dots instead of a
                giant white square.
            */

            if (
                r > 242 &&
                g > 242 &&
                b > 242
            ) {
                continue;
            }


            const color =
                `rgb(${r}, ${g}, ${b})`;


            particles.push({

                x:
                    Math.random() *
                    canvas.width,

                y:
                    Math.random() *
                    canvas.height,

                targetX:
                    startX + x,

                targetY:
                    startY + y,

                color: color,

                size:
                    Math.random() * 1.5 + 1.3,

                vx: 0,
                vy: 0
            });
        }
    }
}


/*
    Animation
*/

function animate() {

    ctx.fillStyle =
        "rgba(255, 248, 245, 0.18)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(p => {

        /*
            Slowly move each particle
            toward its correct position.
        */

        const dx =
            p.targetX - p.x;

        const dy =
            p.targetY - p.y;


        p.vx += dx * 0.003;
        p.vy += dy * 0.003;


        p.vx *= 0.88;
        p.vy *= 0.88;


        p.x += p.vx;
        p.y += p.vy;


        /*
            Mouse interaction
        */

        const mx =
            p.x - mouse.x;

        const my =
            p.y - mouse.y;


        const distance =
            Math.sqrt(
                mx * mx +
                my * my
            );


        if (distance < 90) {

            const force =
                (90 - distance) / 90;


            p.x +=
                (mx / (distance || 1)) *
                force *
                4;


            p.y +=
                (my / (distance || 1)) *
                force *
                4;
        }


        /*
            Draw dot
        */

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            p.color;

        ctx.fill();

    });


    requestAnimationFrame(animate);
}


/*
    Mouse
*/

window.addEventListener(
    "mousemove",
    e => {

        mouse.x = e.clientX;
        mouse.y = e.clientY;

    }
);


/*
    Touchscreen
*/

window.addEventListener(
    "touchmove",
    e => {

        mouse.x =
            e.touches[0].clientX;

        mouse.y =
            e.touches[0].clientY;

    }
);


window.addEventListener(
    "mouseleave",
    () => {

        mouse.x = -1000;
        mouse.y = -1000;

    }
);


/*
    Start
*/

image.onload = () => {

    resize();
    animate();

};


window.addEventListener(
    "resize",
    resize
);

</script>

</body>
</html>
```
